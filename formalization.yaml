# Provenance metadata for the formalization of Alpöge's disproof of the
# uniform-constant Erdős unit-distance conjecture.

result:
  name: erdos_unit_distance_uniform_constant_false
  statement: >
    For every C > 0 and every N there exist n ≥ N and an n-point set
    P ⊆ ℝ² whose number of unit-distance pairs exceeds
    n^(1 + C / log log n).  (Literal negation of Erdős's 1946 conjectured
    bound ν(n) ≤ n^(1 + C/log log n) for an absolute constant C.)
  axioms: [propext, Classical.choice, Quot.sound]
  sorries: 0
  lean_toolchain: leanprover/lean4:v4.30.0   # PrimeNumberTheoremAnd's pin
  note: >
    Strictly weaker than the lean-eval problem
    erdos_unit_distance_conjecture_false (fixed power gain n^(1+δ),
    OpenAI 2026 via class field towers), which remains open in Lean.

artifacts:
  repository: https://github.com/kim-em/erdos-unit-distance
  verification: |
    lake exe cache get && lake build
    # then: import ErdosUnitDistance
    #       #print axioms Erdos.erdos_unit_distance_uniform_constant_false

