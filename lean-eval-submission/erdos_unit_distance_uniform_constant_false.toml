# Proposed new lean-eval problem: the uniform-constant form.
# Companion to (NOT a solution of) erdos_unit_distance_conjecture_false,
# whose fixed-power-gain statement (∃ δ > 0, ν(n) ≥ n^(1+δ)) remains open.
id = "erdos_unit_distance_uniform_constant_false"
title = "The uniform-constant Erdős unit-distance conjecture is false"
test = false
module = "LeanEval.Combinatorics.UnitDistanceUniformConstantFalse"
holes = ["erdos_unit_distance_uniform_constant_false"]
submitter = "Kim Morrison"
notes = """Erdős (1946) conjectured ν(n) ≤ n^{1 + C / log log n} for some absolute C and all sufficiently large n. This problem asks for the literal negation: for every C > 0 there are arbitrarily large n with ν(n) > n^{1 + C / log log n}. This is strictly weaker than erdos_unit_distance_conjecture_false (the OpenAI 2026 fixed-power-gain refutation via class field towers): Alpöge's one-page proof trades the power gain for elementary inputs (multiquadratic CM fields, two pigeonholes, polydisc lattice projections — no class field theory). ν and the planar metric are as in erdos_unit_distance_conjecture_false."""
source = "L. Alpöge, *Integral points on norm-one tori and the Erdős unit-distance exponent*, 2026. https://x.com/__alpoge__/status/2064409100562366543 . Original conjecture: P. Erdős, *On sets of distances of n points*, Amer. Math. Monthly 53 (1946), 248-250."
informal_solution = """Let q_j be the j-th prime ≡ 3 (4), p_i the i-th prime ≡ 1 (4), m = ∏_{i≤t} p_i, and K = ℚ(i, √q_0, …, √q_{g-1}) the multiquadratic CM field of degree 2^(g+1). Each p_i is unramified in K with inertia degree ≤ 2 (the Galois group has exponent 2), so ≥ 2^g primes lie over p_i, and complex conjugation acts freely on them (p ≡ 1 mod 4 makes -1 a square mod p, so a fixed prime would force 2i ∈ 𝔭, i.e. p | 4). Choosing one prime per conjugate pair gives ≥ 2^(t·2^(g-1)) ideals 𝔄 with 𝔄𝔄* = (m); pigeonholing into ideal classes (h_K ≤ |d_K|·4^{2^{g+1}} by Minkowski plus an injective-encoding ideal count) and then unit square-classes (≤ 2^{2^g} by Dirichlet) produces an ideal 𝔟 and a totally positive μ ∈ 𝒪_{K⁺} whose norm fibre Z = {z ∈ 𝔟 : zz̄ = μ} has ≥ 2^{t·2^{g-1}}/(h_K·2^{2^g}) elements, all of one archimedean modulus. Embedding 𝔟 into ℂ^{2^g} coordinatewise, grid pigeonholes give packing/doubling bounds for 𝔟 ∩ polydisc with constants C^{2^g} (no measure theory), and translating by elements of Z yields, after projecting to one complex coordinate, an n-point planar set with ν ≥ #Z·n/(2·64^{2^g}) and n ≤ (32√m)^{2·2^g}. With log log n ≍ g, choosing g ≈ C log t and t large gives ν > n^{1 + C/log log n}. The only analytic input is a Chebyshev-type lower bound for primes in the progressions 1, 3 mod 4 (PNT in AP suffices)."""
